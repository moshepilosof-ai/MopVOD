# רענון קטלוגי YouTube (המקורות שהמשתמש הוסיף דרך MopVODPlayer, רשומים ב-sources.json).
# רץ פעם ביום ובלחיצה. אם YouTube חוסם את השרתים של GitHub, הריצה נכשלת והרענון נעשה מהאפליקציה.
name: Update YouTube sources

on:
  schedule:
    - cron: "0 2 * * *"   # 4:00 / 5:00 שעון ישראל
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp
      - name: Rebuild YouTube catalogs
        run: python ytsource.py --all --dates 3000
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.json vod sources.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update YouTube catalogs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
