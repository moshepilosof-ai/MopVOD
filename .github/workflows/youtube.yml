# רענון קטלוגי YouTube (המקורות שהמשתמש הוסיף דרך MopVODPlayer, רשומים ב-sources.json).
# רץ פעם ביום ובלחיצה. אם YouTube חוסם את השרתים של GitHub, הריצה נכשלת והרענון נעשה מהאפליקציה.
name: Update YouTube sources

on:
  schedule:
    - cron: "0 2 * * *"   # 4:00 / 5:00 שעון ישראל
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp
      - name: Rebuild YouTube catalogs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python ytsource.py --all --dates 3000
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1) only the catalog files; sources.json belongs to the app, youtube.json is regenerated after merging
          git add vod
          if git diff --cached --quiet; then echo "No catalog changes"; else git commit -m "Update YouTube catalogs $(date -u +'%Y-%m-%d %H:%M UTC')"; fi
          # 2) merge whatever the app pushed meanwhile (added/removed sources); on a conflicting catalog keep this run's version
          git pull --rebase -X theirs origin main
          # 3) index from the merged state
          python ytsource.py --index
          git add youtube.json
          if git diff --cached --quiet; then echo "No index changes"; else git commit -m "Update youtube.json index"; fi
          git push
