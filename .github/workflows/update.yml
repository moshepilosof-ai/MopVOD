# רענון אוטומטי של ארכיון ה-VOD: GitHub מריץ את mopvod.py על שרת שלו לפי לוח זמנים,
# ושומר את קובצי ה-JSON המעודכנים חזרה לריפו. אפשר גם להריץ ידנית מלשונית Actions.
name: Update VOD archive

on:
  schedule:
    # UTC. בישראל: 5:30, 11:30, 17:30, 22:30 בחורף (שעה אחת מאוחר יותר בקיץ)
    - cron: "30 3,9,15,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vod
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover programs (new shows on kan.org.il)
        run: python mopvod.py --discover

      - name: Collect new episodes
        run: python mopvod.py --workers 6

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MopVOD.json vod programs.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update VOD archive $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
